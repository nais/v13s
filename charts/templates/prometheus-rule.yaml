{{- if contains "nav" .Values.fasit.tenant.name }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-namespace-workload-vulnerability-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  groups:
    - name: namespace-workload-vulnerability-recording
      rules:
        - record: namespace:vulnerabilities:priority:high:current
          expr: max by (workload_cluster, workload_namespace, workload_name) (nais_workload_vulnerabilities_priority{priority="HIGH", workload_namespace="nais-system"})

        - record: namespace:vulnerabilities:priority:high:max1h
          expr: max by (workload_cluster, workload_namespace, workload_name) (max_over_time(nais_workload_vulnerabilities_priority{priority="HIGH", workload_namespace="nais-system"}[1h]))

        - record: namespace:vulnerabilities:severity:critical:current
          expr: max by (workload_cluster, workload_namespace, workload_name) (nais_workload_vulnerabilities{severity="CRITICAL", workload_namespace="nais-system"})

        - record: namespace:vulnerabilities:severity:critical:max1h
          expr: max by (workload_cluster, workload_namespace, workload_name) (max_over_time(nais_workload_vulnerabilities{severity="CRITICAL", workload_namespace="nais-system"}[1h]))

    - name: namespace-workload-vulnerability-alerts
      rules:
        - alert: "namespace workload vulnerabilities"
          expr: |
            label_replace(
              (namespace:vulnerabilities:priority:high:current > 0)
                and (namespace:vulnerabilities:priority:high:max1h > 0),
              "vulnerability_type", "priority", "workload_name", ".*"
            )
            or
            label_replace(
              (namespace:vulnerabilities:severity:critical:current > 0)
                and (namespace:vulnerabilities:severity:critical:max1h > 0),
              "vulnerability_type", "severity", "workload_name", ".*"
            )
          for: 10m
          labels:
            namespace: nais-system
            severity: warning
            channel: nais-alerts-info
            alert_type: custom
            repeat_interval: 1d
          annotations:
            summary: |
              {{ ":warning: `{{ $labels.workload_name }}` in `{{ $labels.workload_cluster }}` has `{{ $value }}` {{ $labels.vulnerability_type }} vulnerabilities" }}
            description: |
              https://salsa.{{ .Values.fasit.tenant.name }}.cloud.nais.io/projects?searchText={{"{{ $labels.workload_name }}"}}
            consequence: |
              HIGH-priority and CRITICAL-severity vulnerabilities require remediation.
              HIGH priority includes CISA KEV findings, vulnerabilities with known ransomware use, and vulnerabilities with an EPSS percentile of at least 0.95 or score of at least 0.10. A HIGH-priority finding is not necessarily a CISA KEV finding.
            action: |
              1. Open the affected workload in Salsa and identify the packages, CVEs, and running image tag.
              2. Upgrade the affected dependency or use an image with the fix. If no fix is available, remove the affected package or apply the documented mitigation.
              3. Build and redeploy the patched image.
              4. Confirm that the next vulnerability scan no longer reports the finding.
{{- end }}
