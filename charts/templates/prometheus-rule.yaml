{{- if contains "nav" .Values.fasit.tenant.name }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-namespace-workload-vulnerability-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  groups:
    - name: namespace-workload-vulnerability-recording
      rules:
        - record: namespace:vulnerabilities:severity:critical:current
          expr: max by (workload_cluster, workload_namespace, workload_name) (nais_workload_vulnerabilities{severity="CRITICAL", workload_namespace="nais-system"})

        - record: namespace:vulnerabilities:severity:critical:max1h
          expr: max by (workload_cluster, workload_namespace, workload_name) (max_over_time(nais_workload_vulnerabilities{severity="CRITICAL", workload_namespace="nais-system"}[1h]))

        - record: namespace:vulnerabilities:kev:current
          expr: max by (workload_cluster, workload_namespace, workload_name) (nais_workload_vulnerabilities_kev{workload_namespace="nais-system"})

        - record: namespace:vulnerabilities:kev:max1h
          expr: max by (workload_cluster, workload_namespace, workload_name) (max_over_time(nais_workload_vulnerabilities_kev{workload_namespace="nais-system"}[1h]))

    - name: namespace-workload-vulnerability-alerts
      rules:
        - alert: "namespace workload critical vulnerabilities"
          expr: |
            (namespace:vulnerabilities:severity:critical:current > 0)
              and (namespace:vulnerabilities:severity:critical:max1h > 0)
          for: 10m
          labels:
            namespace: nais-system
            severity: warning
            channel: nais-alerts-info
            alert_type: custom
            repeat_interval: 1d
          annotations:
            summary: |
              {{ ":warning: CRITICAL-severity vulnerabilities found in workloads deployed to namespace `{{ $labels.workload_namespace }}`" }}
            description: |
              {{ "`{{ $labels.workload_cluster }}/{{ $labels.workload_name }}`: `{{ $value }}` CRITICAL-severity vulnerabilities — " }}https://salsa.{{ .Values.fasit.tenant.name }}.cloud.nais.io/projects?searchText={{"{{ $labels.workload_name }}"}}
            consequence: |
              CRITICAL-severity vulnerabilities require remediation. This is a raw CVSS severity rollup; it does not by itself mean the vulnerability is known to be exploited. See the separate KEV alert for confirmed exploitation.
            action: |
              1. Open the affected workload in Salsa and identify the packages, CVEs, and running image tag.
              2. Upgrade the affected dependency or use an image with the fix. If no fix is available, remove the affected package or apply the documented mitigation.
              3. Build and redeploy the patched image.
              4. Confirm that the next vulnerability scan no longer reports the finding.

        - alert: "namespace workload KEV vulnerabilities"
          expr: |
            (namespace:vulnerabilities:kev:current > 0)
              and (namespace:vulnerabilities:kev:max1h > 0)
          for: 10m
          labels:
            namespace: nais-system
            severity: critical
            channel: nais-alerts-info
            alert_type: custom
            repeat_interval: 1d
          annotations:
            summary: |
              {{ ":rotating_light: CISA KEV vulnerabilities found in workloads deployed to namespace `{{ $labels.workload_namespace }}`" }}
            description: |
              {{ "`{{ $labels.workload_cluster }}/{{ $labels.workload_name }}`: `{{ $value }}` CISA KEV vulnerabilities — " }}https://salsa.{{ .Values.fasit.tenant.name }}.cloud.nais.io/projects?searchText={{"{{ $labels.workload_name }}"}}
            consequence: |
              These CVEs are listed in CISA's Known Exploited Vulnerabilities catalog, meaning exploitation has been observed in the wild. Treat this as the highest remediation priority.
            action: |
              1. Open the affected workload in Salsa and identify the packages, CVEs, and running image tag.
              2. Upgrade the affected dependency or use an image with the fix. If no fix is available, remove the affected package or apply the documented mitigation.
              3. Build and redeploy the patched image.
              4. Confirm that the next vulnerability scan no longer reports the finding.
{{- end }}
