{{- if contains "nav" .Values.fasit.tenant.name }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-namespace-workload-vulnerability-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  groups:
    - name: namespace-workload-vulnerability-recording
      rules:

        - record: namespace:workload:vulnerabilities:priority:high:max1h
          expr: max by (workload_namespace, workload_name) (
            max_over_time(
            nais_workload_vulnerabilities_priority{
            priority="HIGH",
            workload_namespace="nais-system"
            }[1h]
            )
            )

        - record: namespace:workload:vulnerabilities:priority:high:current
          expr: max by (workload_namespace, workload_name) (
            nais_workload_vulnerabilities_priority{
            priority="HIGH",
            workload_namespace="nais-system"
            }
            )
            or
            max by (workload_namespace, workload_name) (
            0 * nais_workload_vulnerabilities_priority{workload_namespace="nais-system"}
            )

        - record: namespace:workload:vulnerabilities:kev:max1h
          expr: max by (workload_namespace, workload_name) (
            max_over_time(
            nais_workload_vulnerabilities_kev{
            workload_namespace="nais-system"
            }[1h]
            )
            )

        - record: namespace:workload:vulnerabilities:kev:current
          expr: max by (workload_namespace, workload_name) (
            nais_workload_vulnerabilities_kev{
            workload_namespace="nais-system"
            }
            )
            or
            max by (workload_namespace, workload_name) (
            0 * nais_workload_vulnerabilities_kev{workload_namespace="nais-system"}
            )

        - record: namespace:workload:vulnerabilities:priority:elevated:max1h
          expr: max by (workload_namespace, workload_name) (
            max_over_time(
            nais_workload_vulnerabilities_priority{
            priority="ELEVATED",
            workload_namespace="nais-system"
            }[1h]
            )
            )

        - record: namespace:workload:vulnerabilities:priority:elevated:current
          expr: max by (workload_namespace, workload_name) (
            nais_workload_vulnerabilities_priority{
            priority="ELEVATED",
            workload_namespace="nais-system"
            }
            )
            or
            max by (workload_namespace, workload_name) (
            0 * nais_workload_vulnerabilities_priority{workload_namespace="nais-system"}
            )

        - record: namespace:workload:vulnerabilities:critical:max1h
          expr: max by (workload_namespace, workload_name) (
            max_over_time(
            nais_workload_vulnerabilities{
            severity="CRITICAL",
            workload_namespace="nais-system"
            }[1h]
            )
            )

        - record: namespace:workload:vulnerabilities:critical:current
          expr: max by (workload_namespace, workload_name) (
            nais_workload_vulnerabilities{
            severity="CRITICAL",
            workload_namespace="nais-system"
            }
            )
            or
            max by (workload_namespace, workload_name) (
            0 * nais_workload_vulnerabilities{workload_namespace="nais-system"}
            )

    - name: namespace-workload-vulnerability-alerts
      rules:
        - alert: "workload high priority vulnerabilities"
          expr: (namespace:workload:vulnerabilities:priority:high:current > 0)
            and (namespace:workload:vulnerabilities:priority:high:max1h > 0)
          for: 10m
          labels:
            namespace: nais-system
            severity: critical
            channel: nais-alerts
            alert_type: custom
            repeat_interval: 1d
          annotations:
            summary: |
              {{ ":rotating_light: Priority HIGH vulnerabilities found in workloads deployed to namespace `{{ $labels.workload_namespace }}`" }}
            description: |
              {{ "`{{ $labels.workload_name }}` has `{{ $value }}` HIGH-priority vulnerabilities." }}
              https://salsa.{{ .Values.fasit.tenant.name }}.cloud.nais.io/projects?searchText={{"{{ $labels.workload_name }}"}}
            consequence: HIGH is a broad operational priority. It may include KEV findings, but also ransomware or EPSS-based risk signals. Use the separate KEV alert to identify confirmed exploitation.
            action: |
              1. Open the workload in Salsa and identify the affected packages, CVEs, and running image tag.
              2. Upgrade the affected dependency or use an image with the fix. If no fix is available, remove the affected package or apply the documented mitigation.
              3. Build and redeploy the patched image.
              4. Confirm that the next vulnerability scan no longer reports the finding.
              HIGH includes CVEs in CISA KEV, findings with known ransomware use, and findings with an EPSS percentile of at least 0.95 or score of at least 0.10. A HIGH alert alone does not mean the CVE is in KEV.

        - alert: "workload KEV vulnerabilities"
          expr: (namespace:workload:vulnerabilities:kev:current > 0)
            and (namespace:workload:vulnerabilities:kev:max1h > 0)
          for: 10m
          labels:
            namespace: nais-system
            severity: critical
            channel: nais-alerts
            alert_type: custom
            repeat_interval: 1d
          annotations:
            summary: |
              {{ ":rotating_light: CISA KEV vulnerabilities found in workloads deployed to namespace `{{ $labels.workload_namespace }}`" }}
            description: |
              {{ "`{{ $labels.workload_name }}` has `{{ $value }}` vulnerabilities listed in CISA's Known Exploited Vulnerabilities catalog." }}
              https://salsa.{{ .Values.fasit.tenant.name }}.cloud.nais.io/projects?searchText={{"{{ $labels.workload_name }}"}}
            consequence: CISA lists these CVEs as exploited in the wild. Unlike the broader HIGH-priority alert, this alert confirms that the workload contains a KEV finding. Treat this as an urgent remediation task.
            action: |
              1. Open the workload in Salsa and identify the affected packages, CVEs, and running image tag.
              2. Upgrade the affected dependency or use an image with the fix. If no fix is available, remove the affected package or apply the documented mitigation.
              3. Build and redeploy the patched image.
              4. Confirm that the next vulnerability scan no longer reports the finding.

        - alert: "workload elevated priority vulnerabilities"
          expr: (namespace:workload:vulnerabilities:priority:elevated:current > 0)
            and (namespace:workload:vulnerabilities:priority:elevated:max1h > 0)
          for: 10m
          labels:
            namespace: nais-system
            severity: warning
            channel: nais-alerts-info
            alert_type: custom
            repeat_interval: 1d
          annotations:
            summary: |
              {{ ":warning: Priority ELEVATED vulnerabilities found in workloads deployed to namespace `{{ $labels.workload_namespace }}`" }}
            description: |
              {{ "`{{ $labels.workload_name }}` has `{{ $value }}` ELEVATED-priority vulnerabilities." }}
              https://salsa.{{ .Values.fasit.tenant.name }}.cloud.nais.io/projects?searchText={{"{{ $labels.workload_name }}"}}
            consequence: These are CRITICAL or HIGH severity findings with an elevated predicted likelihood of exploitation, but no HIGH-priority signal. They are not CISA KEV findings.
            action: |
              1. Open the workload in Salsa and identify the affected packages, CVEs, and running image tag.
              2. Upgrade the affected dependency or use an image with the fix. If no fix is available, remove the affected package or apply the documented mitigation.
              3. Build and redeploy the patched image.
              4. Confirm that the next vulnerability scan no longer reports the finding.
              ELEVATED covers CRITICAL or HIGH findings with an EPSS percentile of at least 0.90, or missing EPSS data, when no HIGH-priority signal applies.

        - alert: "workload critical vulnerabilities"
          expr: (namespace:workload:vulnerabilities:critical:current > 0)
            and (namespace:workload:vulnerabilities:critical:max1h > 0)
          for: 10m
          labels:
            namespace: nais-system
            severity: info
            channel: nais-alerts-info
            alert_type: custom
            repeat_interval: 1d
          annotations:
            summary: |
              {{ ":information_source: Informational alert: CVSS CRITICAL vulnerabilities found in workload(s) deployed to namespace `{{ $labels.workload_namespace }}`" }}
            description: |
              {{ "`{{ $labels.workload_name }}` has `{{ $value }}` vulnerabilities with CVSS severity CRITICAL." }}
              https://salsa.{{ .Values.fasit.tenant.name }}.cloud.nais.io/projects?searchText={{"{{ $labels.workload_name }}"}}
            consequence: This is an informational rollup. Critical severity alone does not establish exploitation likelihood.
            action: |
              1. Open the workload in Salsa and identify the affected packages, CVEs, and running image tag.
              2. Prioritize any finding that is also HIGH or ELEVATED, or is listed in CISA KEV.
              3. Upgrade the affected dependency or use an image with the fix.
              4. Build and redeploy the patched image, then confirm that the next vulnerability scan no longer reports the finding.
{{- end }}
