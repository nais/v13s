{{- if contains "nav" .Values.fasit.tenant.name }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-namespace-workload-vulnerability-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  groups:
    - name: namespace-workload-vulnerability-recording
      rules:

        - record: namespace:workload:vulnerabilities:priority:high:max1h
          expr: max by (workload_namespace, workload_name) (
            max_over_time(
            nais_workload_vulnerabilities_priority{
            priority="HIGH",
            workload_namespace="nais-system"
            }[1h]
            )
            )

        - record: namespace:workload:vulnerabilities:priority:high:current
          expr: max by (workload_namespace, workload_name) (
            nais_workload_vulnerabilities_priority{
            priority="HIGH",
            workload_namespace="nais-system"
            }
            )
            or
            max by (workload_namespace, workload_name) (
            0 * nais_workload_vulnerabilities_priority{workload_namespace="nais-system"}
            )

        - record: namespace:workload:vulnerabilities:priority:elevated:max1h
          expr: max by (workload_namespace, workload_name) (
            max_over_time(
            nais_workload_vulnerabilities_priority{
            priority="ELEVATED",
            workload_namespace="nais-system"
            }[1h]
            )
            )

        - record: namespace:workload:vulnerabilities:priority:elevated:current
          expr: max by (workload_namespace, workload_name) (
            nais_workload_vulnerabilities_priority{
            priority="ELEVATED",
            workload_namespace="nais-system"
            }
            )
            or
            max by (workload_namespace, workload_name) (
            0 * nais_workload_vulnerabilities_priority{workload_namespace="nais-system"}
            )

        - record: namespace:workload:vulnerabilities:critical:max1h
          expr: max by (workload_namespace, workload_name) (
            max_over_time(
            nais_workload_vulnerabilities{
            severity="CRITICAL",
            workload_namespace="nais-system"
            }[1h]
            )
            )

        - record: namespace:workload:vulnerabilities:critical:current
          expr: max by (workload_namespace, workload_name) (
            nais_workload_vulnerabilities{
            severity="CRITICAL",
            workload_namespace="nais-system"
            }
            )
            or
            max by (workload_namespace, workload_name) (
            0 * nais_workload_vulnerabilities{workload_namespace="nais-system"}
            )

    - name: namespace-workload-vulnerability-alerts
      rules:
        - alert: "workload high priority vulnerabilities"
          expr: (namespace:workload:vulnerabilities:priority:high:current > 0)
            and (namespace:workload:vulnerabilities:priority:high:max1h > 0)
          for: 10m
          labels:
            namespace: nais-system
            severity: critical
            channel: nais-alerts
            alert_type: custom
            repeat_interval: 1d
          annotations:
            summary: |
              {{ ":rotating_light: Priority HIGH vulnerabilities found in workloads deployed to namespace `{{ $labels.workload_namespace }}`" }}
            description: |
              {{ "`{{ $labels.workload_name }}` has `{{ $value }}` priority vulnerabilities." }}
              https://salsa.{{ .Values.fasit.tenant.name }}.cloud.nais.io/projects?searchText={{"{{ $labels.workload_name }}"}}
            consequence: Known exploitation or high exploitation likelihood; workload should be patched now
            action: |
              1. HIGH is set by v13s priority logic when a CVE is in the CISA KEV (Known Exploited Vulnerabilities) feed, has `known_ransomware_use=true`, or has `EPSS percentile >= 0.95` or `EPSS score >= 0.10`
              2. In practice this means known or highly likely exploitation and should be treated as the top remediation priority
              3. Visit Salsa and open the affected workload from this alert
              4. Verify affected packages and running image tag
              5. Use CVSS score/severity (e.g. CRITICAL/HIGH) as supporting context, but treat HIGH priority as the primary remediation priority
              6. Redeploy affected workloads

        - alert: "workload elevated priority vulnerabilities"
          expr: (namespace:workload:vulnerabilities:priority:elevated:current > 0)
            and (namespace:workload:vulnerabilities:priority:elevated:max1h > 0)
          for: 10m
          labels:
            namespace: nais-system
            severity: warning
            channel: nais-alerts-info
            alert_type: custom
            repeat_interval: 1d
          annotations:
            summary: |
              {{ ":warning: Priority ELEVATED vulnerabilities found in workloads deployed to namespace `{{ $labels.workload_namespace }}`" }}
            description: |
              {{ "`{{ $labels.workload_name }}` has `{{ $value }}` priority vulnerabilities." }}
              https://salsa.{{ .Values.fasit.tenant.name }}.cloud.nais.io/projects?searchText={{"{{ $labels.workload_name }}"}}
            consequence: Elevated security risk; workload should be patched soon
            action: |
              1. ELEVATED is set by v13s priority logic for CRITICAL/HIGH severity findings with `EPSS percentile >= 0.90`, or where EPSS data is missing (precautionary), and no HIGH rule matched
              2. In practice this means a plausible exploitation path that is not yet confirmed
              3. Visit Salsa and open the affected workload from this alert
              4. Verify affected packages and exposure surface
              5. Use CVSS score/severity as supporting context
              6. Redeploy affected workloads

        - alert: "workload critical vulnerabilities"
          expr: (namespace:workload:vulnerabilities:critical:current > 0)
            and (namespace:workload:vulnerabilities:critical:max1h > 0)
          for: 10m
          labels:
            namespace: nais-system
            severity: info
            channel: nais-alerts-info
            alert_type: custom
            repeat_interval: 1d
          annotations:
            summary: |
              {{ ":information_source: Informational alert: CVSS CRITICAL vulnerabilities found in workload(s) deployed to namespace `{{ $labels.workload_namespace }}`" }}
            description: |
              {{ "`{{ $labels.workload_name }}` has `{{ $value }}` vulnerabilities with CVSS severity CRITICAL." }}
              https://salsa.{{ .Values.fasit.tenant.name }}.cloud.nais.io/projects?searchText={{"{{ $labels.workload_name }}"}}
            consequence: Informational rollup; review and prioritize remediation based on risk
            action: |
              1. Visit Salsa and open the affected workload
              2. Review vulnerabilities and prioritize any findings that are HIGH or ELEVATED priority
              3. Check for available patches and update images
              4. Redeploy affected workloads
{{- end }}
