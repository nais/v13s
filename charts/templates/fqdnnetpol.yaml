apiVersion: networking.gke.io/v1alpha3
kind: FQDNNetworkPolicy
metadata:
  name: "{{ .Release.Name }}-fqdn"
  labels:
    {{ include "v13s.labels" . | nindent 4 }}
spec:
  egress:
  - ports:
    - port: 80
      protocol: TCP
    to:
    - fqdns:
      - metadata.google.internal
  - ports:
    - port: 443
      protocol: TCP
    to:
    - fqdns:
      - private.googleapis.com
      - cisa.gov
      - www.cisa.gov
      - api.osv.dev
      - ttl.sh
      - sigstore-tuf-root.storage.googleapis.com
      - tuf-repo-cdn.sigstore.dev
      - europe-north1-docker.pkg.dev
      {{- with .Values.kev.enisaURL }}
      - {{ (urlParse .).host }}
      {{- end }}
      {{- if .Values.kev.vulncheck.enabled }}
      - {{ (urlParse .Values.kev.vulncheck.url).host }}
      # VulnCheck serves backup archives from a separate download host.
      - serve.vulncheck.com
      {{- end }}
{{- $root := . }}
{{- range split "," .Values.kubernetes.clusters }}
  - ports:
      - port: 443
        protocol: TCP
    to:
      - fqdns:
          - "apiserver.{{ . }}.{{ $root.Values.fasit.tenant.name }}.cloud.nais.io"
          - "prometheus-pushgateway.{{ . }}.{{ $root.Values.fasit.tenant.name }}.cloud.nais.io"
{{- end }}
{{- if .Values.kubernetes.static }}
{{- range split "," .Values.kubernetes.static }}
  - ports:
      - port: 443
        protocol: TCP
    to:
      - fqdns:
          - {{ (split "|" .)._1  }}
{{- end }}
{{- end }}
  podSelector:
    matchLabels:
      {{ include "v13s.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Egress
