name: Verify workflow dependencies

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'mise/tasks/actions-lock/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.1.1
        with:
          install: false
      - name: Install actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0
      - name: Verify actions.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run actions-lock:verify
